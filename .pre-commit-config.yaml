repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Exécute le linter Ruff et corrige automatiquement ce qui peut l'être (--fix)
      - id: ruff
        args: [--config=backend/pyproject.toml, --fix]
      # Exécute le formateur Ruff
      - id: ruff-format
        args: [--config=backend/pyproject.toml]

  # Pyright utilise l'environnement de développement du backend.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: backend/.venv/bin/pyright --project backend/pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
